; HydroIA Velian — Sensor ESP32 (PlatformIO)
; Abre la carpeta firmware/ en VS Code con la extensión PlatformIO.
; El sketch vive en hydroia_sensor/hydroia_sensor.ino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<../hydroia_sensor/>
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^7.0.0
